<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUBAL HUB — Moderation</title>
<link rel="stylesheet" href="../assets/css/global-theme.css?v=20260921"><style>
body{margin:0;min-height:100vh;background:var(--theme-bg);color:var(--theme-text);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}.panel{background:var(--theme-panel);border:1px solid var(--theme-line);border-radius:18px;padding:22px;margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input,.row select{flex:1;min-width:180px;padding:12px;border-radius:10px;border:1px solid var(--theme-line);background:#0003;color:inherit}.btn{padding:11px 15px;border:0;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--theme-accent),var(--theme-accent2));font-weight:800}.danger{background:#d9363e;color:#fff}.muted{background:#d28b18;color:#fff}.ok{background:#248a52;color:#fff}.status{margin-top:16px;padding:14px;border-radius:12px;background:#0003;line-height:1.6}.hidden{display:none}.back{color:var(--theme-accent)}small{color:var(--theme-muted)}
</style></head><body class="theme-galaxy"><main class="wrap"><a class="back" href="../index.html">← TUBAL HUB</a><h1>🛡️ Chat Moderation</h1><p><small>Admin-only moderation controls. Server/Firebase Rules must enforce the admin role.</small></p>
<section class="panel" id="loginPanel">Checking admin access…</section>
<section class="panel hidden" id="bannedPanel"><h2>🚫 Banned Users</h2><div id="bannedList" class="status">Loading banned users…</div></section><section class="panel hidden" id="adminPanel"><h2>Moderate User</h2><div class="row"><input id="uid" placeholder="User UID"><button class="btn" id="load">Load User</button></div><div id="result" class="status hidden"></div><div class="row" style="margin-top:14px"><select id="action"><option value="active">Unban / Unmute / Restore</option><option value="warn">Add Warning</option><option value="mute">Mute 24 Hours</option><option value="ban">Ban Chat Access</option></select><input id="reason" placeholder="Reason"></div><button class="btn" id="apply" style="margin-top:10px">Apply Moderation</button></section></main>
<script type="module">
import{auth,app}from"../assets/js/firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,onSnapshot}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const db=getFirestore(app),bannedList=document.getElementById('bannedList'),bannedPanel=document.getElementById('bannedPanel'),login=document.getElementById('loginPanel'),admin=document.getElementById('adminPanel'),result=document.getElementById('result'),uid=document.getElementById('uid'),action=document.getElementById('action'),reason=document.getElementById('reason');
let target=null;
onAuthStateChanged(auth,async user=>{if(!user){login.textContent='Please log in with an administrator account.';return}const token=await user.getIdTokenResult(true);if(token.claims.admin!==true){login.textContent='Access denied. Administrator permission is required.';return}login.textContent='✓ Administrator access verified.';admin.classList.remove('hidden');bannedPanel.classList.remove('hidden');subscribeBannedUsers()});
function subscribeBannedUsers(){const q=query(collection(db,'users'),where('chatStatus','==','banned'));onSnapshot(q,snap=>{if(snap.empty){bannedList.textContent='No banned users.';return}bannedList.innerHTML='';snap.forEach(s=>{const d=s.data(),row=document.createElement('div');row.style='padding:10px 0;border-bottom:1px solid var(--theme-line)';row.innerHTML='<b>'+String(d.displayName||d.email||s.id).replace(/[<>&"]/g,'')+'</b><br><small>UID: '+s.id+' | '+String(d.banReason||'No reason').replace(/[<>&"]/g,'')+'</small>';bannedList.appendChild(row)})},err=>{bannedList.textContent='Unable to load banned users.';console.error(err)})}
document.getElementById('load').onclick=async()=>{if(!uid.value.trim())return;target=uid.value.trim();const snap=await getDoc(doc(db,'users',target));const d=snap.exists()?snap.data():{};result.classList.remove('hidden');result.textContent='Status: '+(d.chatStatus||'active')+' | Warnings: '+Number(d.warnings||0)+(d.banReason?' | Reason: '+d.banReason:'')};
document.getElementById('apply').onclick=async()=>{if(!target)return alert('Load a user first.');const a=action.value, data={updatedAt:serverTimestamp(),moderatedBy:auth.currentUser.uid};if(a==='active'){data.chatStatus='active';data.mutedUntil=null;data.banReason=null}else if(a==='warn'){data.chatStatus='active';data.warnings=(Number((await getDoc(doc(db,'users',target))).data()?.warnings||0)+1)}else if(a==='mute'){data.chatStatus='muted';data.mutedUntil=new Date(Date.now()+86400000);data.banReason=reason.value.trim()||'Temporary chat restriction'}else{data.chatStatus='banned';data.mutedUntil=null;data.banReason=reason.value.trim()||'Community guidelines violation'}await setDoc(doc(db,'users',target),data,{merge:true});alert('Moderation action applied.');document.getElementById('load').click()};
</script><script src="../assets/js/theme.js?v=20260921" defer></script><script type="module" src="../assets/js/presence.js?v=20260923"></script>
</body>
</html>

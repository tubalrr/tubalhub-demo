<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | TUBAL HUB</title><link rel="stylesheet" href="../assets/css/platform-pages.css"><link rel="stylesheet" href="../assets/css/global-theme.css"><style>body{min-height:100vh}.checkout{max-width:900px;margin:auto;padding:50px 20px}.box{background:#ffffff0a;border:1px solid #ffffff18;border-radius:22px;padding:28px;backdrop-filter:blur(18px)}h1{margin:0 0 8px}.muted{color:#9aa8a0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#9aa8a0}.field input,.field textarea{border:1px solid #ffffff18;background:#05080699;color:#fff;border-radius:10px;padding:12px;outline:0}.items{margin:22px 0;border-top:1px solid #ffffff12}.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff12}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-top:18px}.pay{width:100%;margin-top:22px;border:0;border-radius:12px;padding:14px;background:#8cff57;color:#071007;font-weight:900;cursor:pointer}.pay:disabled{opacity:.5;cursor:not-allowed}.notice{margin-top:15px;padding:12px;border-radius:10px;background:#ffffff08;color:#aebdb3;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header><a class="brand" href="../index.html"><img src="../tubal-hub-logo.png" alt="TUBAL HUB"><span>TUBAL HUB<small>THREE BRANDS. ONE HUB.</small></span></a></header><main class="checkout"><div class="box"><span class="muted">TUBAL HUB / CHECKOUT</span><h1>Secure Checkout</h1><p class="muted">Review your order and enter your contact details.</p><div id="items" class="items"></div><div class="total"><span>Total</span><span id="total">Free</span></div><form id="form"><div class="grid"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Notes (optional)</label><textarea id="notes" rows="3"></textarea></div></div><button class="pay" id="pay" type="submit">Continue to Payment</button></form><div class="notice">Payment gateway connection is ready for backend integration. Never place private payment/API keys in this page.</div></div></main><script src="../assets/js/theme.js" defer></script><script>(()=>{const cart=JSON.parse(sessionStorage.getItem('tubalHubCart')||'[]');const items=document.getElementById('items'),total=document.getElementById('total');if(!cart.length){items.innerHTML='<p class="muted">Your cart is empty. Return to the Shop.</p>';document.getElementById('pay').disabled=true;return}items.innerHTML=cart.map(x=>'<div class="item"><span>'+x.icon+' '+x.name+'</span><b>'+x.price+'</b></div>').join('');total.textContent=cart.every(x=>x.price==='Free')?'Free':'Review at payment';document.getElementById('form').onsubmit=e=>{e.preventDefault();const order={items:cart,name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),notes:document.getElementById('notes').value.trim(),createdAt:new Date().toISOString(),status:'pending'};sessionStorage.setItem('tubalHubOrder',JSON.stringify(order));location.href='checkout-success.html'};})();</script><script type="module" src="../assets/js/presence.js?v=20260923"></script>
</body>
</html>

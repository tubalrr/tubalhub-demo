<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | TUBAL HUB</title><link rel="stylesheet" href="admin-neon.css"></head>
<body class="auth-page"><main class="auth-wrap"><form class="auth-card" id="loginForm">
<img src="../tubal-hub-logo.png" alt="TUBAL HUB"><div class="eyebrow">SECURE ACCESS</div><h1>TUBAL HUB <em>ADMIN</em></h1><p>Sign in with the authorized administrator account.</p>
<label>Email<input id="email" type="email" autocomplete="username" value="" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">SIGN IN <b>→</b></button>
<button type="button" id="resetBtn" class="reset-btn">FORGOT PASSWORD?</button>
<div id="status" class="status"></div>
<a class="back" href="../index.html">← Back to Website</a></form></main>
<script type="module">
import {auth} from "../assets/js/firebase-config.js";
import {signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const form=document.getElementById("loginForm");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const resetBtn=document.getElementById("resetBtn");
const status=document.getElementById("status");

onAuthStateChanged(auth,async user=>{
  if(!user)return;
  try{
    const token=await user.getIdTokenResult();
    if(token.claims.admin===true){
      location.replace("admin.html");
    }else{
      status.textContent="This account is not authorized.";
      status.className="status error";
    }
  }catch(error){
    console.error("Admin claim check failed:",error);
    status.textContent="Could not verify administrator access.";
    status.className="status error";
  }
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  status.textContent="Signing in…";
  status.className="status";
  try{
    const c=await signInWithEmailAndPassword(auth,emailInput.value.trim(),passwordInput.value);
    const token=await c.user.getIdTokenResult(true);
    if(token.claims.admin!==true){
      await auth.signOut();
      throw new Error("This account is not authorized.");
    }
    location.replace("admin.html");
  }catch(err){
    console.error("Admin login error:",err);
    if(err.code==="auth/invalid-credential" || err.code==="auth/wrong-password" || err.code==="auth/user-not-found"){
      status.textContent="Invalid email or password. Use Forgot Password if you don't remember the Firebase password.";
    }else{
      status.textContent=err.message || "Login failed.";
    }
    status.className="status error";
  }
});

resetBtn.addEventListener("click",async()=>{
  const email=emailInput.value.trim();
  if(!email){
    status.textContent="Enter your admin email first.";
    status.className="status error";
    return;
  }
  status.textContent="Sending password reset email…";
  status.className="status";
  try{
    await sendPasswordResetEmail(auth,email);
    status.textContent="Password reset email sent. Check the inbox for that address.";
    status.className="status success";
    passwordInput.value="";
  }catch(err){
    console.error("Password reset error:",err);
    status.textContent=err.message || "Could not send password reset email.";
    status.className="status error";
  }
});
</script></body></html>
